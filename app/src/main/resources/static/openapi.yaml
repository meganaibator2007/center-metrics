      summary: История загрузок
      description: Доступ — админ; РОП с полномочием IMPORT.
      operationId: listImports
      responses:
        '200':
          description: Загрузки
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportJobDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Журнал и импорт]
      summary: Загрузка и проверка файла
      description: Доступ — админ; РОП с полномочием IMPORT — своя область. Возвращает протокол, ничего не меняя.
      operationId: validateImport
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type:
                  $ref: '#/components/schemas/ImportType'
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Файл проверен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/imports/{id}/apply:
    post:
      tags: [Журнал и импорт]
      summary: Подтверждение загрузки
      description: Доступ — админ; РОП с полномочием IMPORT — своя область. Загружает строки NEW и UPDATE.
      operationId: applyImport
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Загружено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Загрузка уже применена
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/imports/templates/{type}:
    get:
      tags: [Журнал и импорт]
      summary: Шаблон XLSX
      description: Доступ — админ; РОП с полномочием IMPORT.
      operationId: downloadImportTemplate
      parameters:
        - name: type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ImportType'
      responses:
        '200':
          description: Шаблон
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: JSESSIONID
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      description: Номер страницы с нуля
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Ошибка в полях запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Нужен вход
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: >-
        Нет прав или нет CSRF-токена. Пока не сменён пароль, выданный администратором, сервер отвечает 403
        с `passwordChangeRequired: true` на всё, кроме /api/auth/me, /api/auth/password и выхода
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Не найдено
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Действие противоречит состоянию данных
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      type: object
      description: Ошибка в формате RFC 9457.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: [string, 'null']
        instance:
          type: string
        errors:
          type: object
          description: 'Только для 400: имя поля → текст'
          additionalProperties:
            type: string
        passwordChangeRequired:
          type: boolean
          description: 'Только для 403: сначала нужно сменить выданный пароль'
    PageMeta:
      type: object
      description: Сведения о странице.
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
          description: Номер страницы с нуля
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Role:
      type: string
      description: Функциональная роль. У человека их может быть несколько.
      enum: [EMPLOYEE, REVIEWER, DIRECTOR, ADMIN]
    Category:
      type: string
      description: Категория оценки. У сотрудника их может быть несколько.
      enum: [PPS, AUP, ROP]
    Permission:
      type: string
      description: 'Полномочие сверх роли: загрузка XLSX, ввод за другого, самостоятельный ввод сотрудником АУП.'
      enum: [IMPORT, ENTER_FOR_OTHERS, AUP_SELF_ENTRY]
    DepartmentDto:
      type: object
      description: Подразделение.
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    DepartmentRequest:
      type: object
      description: Создание и изменение подразделения.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 150
    ProgramDto:
      type: object
      description: Образовательная программа.
      required: [id, code, name, topIt]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        topIt:
          type: boolean
          description: 'Программа «топ-ИТ»: только её дисциплины учитываются в показателях, где нужна программа'
    ProgramRequest:
      type: object
      description: Создание и изменение образовательной программы.
      required: [code, name, topIt]
      properties:
        code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 255
        topIt:
          type: boolean
    LoginRequest:
      type: object
      description: Вход.
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
    ChangePasswordRequest:
      type: object
      description: Смена своего пароля.
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          description: 'Отличается от текущего; от 8 символов и не больше 72 байт (около 36 русских букв), хотя бы одна буква и одна цифра, без логина внутри и не из списка популярных паролей'
    ResetPasswordRequest:
      type: object
      description: Выдача нового временного пароля администратором.
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          description: 'От 8 символов и не больше 72 байт (около 36 русских букв), хотя бы одна буква и одна цифра, без логина внутри и не из списка популярных паролей'
    ActiveRequest:
      type: object
      description: Активация и деактивация.
      required: [active]
      properties:
        active:
          type: boolean
    CommentRequest:
      type: object
      description: Решение, где причина обязательна.
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 1000
    DecisionRequest:
      type: object
      description: Решение, где комментарий необязателен.
      properties:
        comment:
          type: [string, 'null']
          maxLength: 1000
    UserDto:
      type: object
      description: Сотрудник и его учётная запись.
      required: [id, login, fullName, lastName, firstName, middleName, externalId, roles, categories, permissions,
        departmentId, departmentName, managerId, position, programIds, reviewProgramIds, active, mustChangePassword]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        fullName:
          type: string
          description: Фамилия, имя и отчество через пробел
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: [string, 'null']
        externalId:
          type: [string, 'null']
          description: Устойчивый ключ для повторного импорта
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        departmentId:
          type: [integer, 'null']
          format: int64
        departmentName:
          type: [string, 'null']
        managerId:
          type: [integer, 'null']
          format: int64
        position:
          type: [string, 'null']
        programIds:
          type: array
          items:
            type: integer
            format: int64
          description: Программы, к которым привязан сотрудник
        reviewProgramIds:
          type: array
          items:
            type: integer
            format: int64
          description: Программы, результаты которых он проверяет как РОП
        active:
          type: boolean
          description: false — учётная запись деактивирована
        mustChangePassword:
          type: boolean
          description: Пароль временный, клиент предлагает сменить его
    UserRequest:
      type: object
      description: Создание и изменение сотрудника.
      required: [lastName, firstName, middleName, login, roles, categories, departmentId, position, programIds,
        password]
      properties:
        lastName:
          type: string
          maxLength: 100
        firstName:
          type: string
          maxLength: 100
        middleName:
          type: [string, 'null']
          maxLength: 100
        login:
          type: string
          description: a-z, 0-9, точка и дефис, 3–50 символов
          pattern: ^[a-z0-9.-]{3,50}$
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: Хотя бы одна роль
          minItems: 1
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        departmentId:
          type: [integer, 'null']
          format: int64
        position:
          type: [string, 'null']
          maxLength: 100
        programIds:
          type: array
          items:
            type: integer
            format: int64
        reviewProgramIds:
          type: array
          items:
            type: integer
            format: int64
          description: Обязательны, если среди ролей есть REVIEWER
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        managerId:
          type: [integer, 'null']
          format: int64
