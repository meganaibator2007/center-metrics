openapi: 3.1.0
info:
  title: center-metrics API
  version: 0.2.0
  description: |
    Контракт API системы учёта показателей эффективности. Основание — ТЗ «Система учёта показателей эффективности».
    Это план: большая часть методов ещё не реализована. Что уже работает в коде,
    видно в Swagger UI на вкладке «Реализовано в коде».

    Краткий список адресов — в `docs/api.md`. Меняем запрос или ответ — правим оба файла.

    **Вход.** Сессия в cookie `JSESSIONID` (HttpOnly). Без входа доступны только
    `GET /api/auth/csrf`, `POST /api/auth/login` и `GET /api/health`.

    **CSRF.** Запросы, меняющие данные (POST, PUT, PATCH, DELETE), включая вход,
    передают токен в заголовке `X-XSRF-TOKEN`. Токен лежит в cookie `XSRF-TOKEN`,
    её выдаёт `GET /api/auth/csrf`. После входа и выхода токен меняется.

    **Ошибки** приходят в формате ProblemDetail (RFC 9457). Ошибки по полям формы —
    в свойстве `errors`: имя поля → текст.

    **Роли.** `EMPLOYEE` — сотрудник, `REVIEWER` — проверяющий (РОП) в своей области,
    `DIRECTOR` — директор, `ADMIN` — суперадминистратор. У человека их может быть несколько.
    Администратор не заменяет директора при утверждении.
tags:
  - name: Вход и система
  - name: Сотрудники и оргструктура
  - name: Показатели
  - name: Отчётные периоды
  - name: Достижения
  - name: Целевые показатели РОП
  - name: Баллы и дашборды
  - name: Отчёты
  - name: Журнал и импорт
security:
  - session: []
paths:
  /api/auth/csrf:
    get:
      tags: [Вход и система]
      summary: Выдача CSRF-cookie перед входом
      description: Доступ — все. Записывает токен в cookie `XSRF-TOKEN`.
      operationId: getCsrfToken
      security: []
      responses:
        '204':
          description: Cookie выдана
  /api/auth/login:
    post:
      tags: [Вход и система]
      summary: Вход
      description: >-
        Доступ — все. При успехе создаёт сессию. После 5 неудачных попыток для логина за 15 минут
        или 20 с одного адреса вход закрывается на 15 минут даже с верным паролем — ответ 429.
      operationId: login
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный логин или пароль, либо учётная запись деактивирована
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Слишком много неудачных попыток. В `detail` — через сколько минут повторить
          headers:
            Retry-After:
              description: Через сколько секунд можно повторить вход
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/auth/logout:
    post:
      tags: [Вход и система]
      summary: Выход
      description: Доступ — вошедшие.
      operationId: logout
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Выход выполнен
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me:
    get:
      tags: [Вход и система]
      summary: Текущий пользователь
      description: Доступ — вошедшие.
      operationId: getCurrentUser
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password:
    post:
      tags: [Вход и система]
      summary: Смена своего пароля
      description: Доступ — вошедшие. Снимает признак временного пароля.
      operationId: changePassword
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Пароль изменён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/health:
    get:
      tags: [Вход и система]
      summary: Проверка сервера
      description: Доступ — все. Отвечает Spring Boot Actuator, проверяет и подключение к базе.
      operationId: health
      security: []
      responses:
        '200':
          description: Сервер работает
        '503':
          description: Сервер запущен, но база недоступна
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/users:
    get:
      tags: [Сотрудники и оргструктура]
      summary: Список сотрудников
      description: Доступ — админ, директор.
      operationId: listUsers
      parameters:
        - name: q
          in: query
          description: Поиск по ФИО и логину
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - name: departmentId
          in: query
          schema:
            type: integer
            format: int64
        - name: active
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Сотрудники и оргструктура]
      summary: Создание сотрудника
      description: Доступ — админ.
      operationId: createUser
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Логин или внешний идентификатор уже заняты
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/users/{id}:
    get:
      tags: [Сотрудники и оргструктура]
      summary: Карточка сотрудника
      description: Доступ — админ, директор.
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Сотрудник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Сотрудники и оргструктура]
      summary: Изменение сотрудника
      description: Доступ — админ. Смена подразделения пишется в историю переводов, смена ролей закрывает прежние
        назначения.
      operationId: updateUser
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: Изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Логин или внешний идентификатор уже заняты
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/users/{id}/active:
    patch:
      tags: [Сотрудники и оргструктура]
      summary: Активация и деактивация
      description: Доступ — админ.
      operationId: setUserActive
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveRequest'
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Нельзя деактивировать собственную учётную запись
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/users/{id}/reset-password:
    post:
      tags: [Сотрудники и оргструктура]
      summary: Выдача временного пароля
      description: 'Доступ — админ. Восстановление доступа: при следующем входе пароль нужно сменить.'
      operationId: resetPassword
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Пароль выдан
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/users/{id}/history:
    get:
      tags: [Сотрудники и оргструктура]
      summary: История переводов
      description: Доступ — админ, директор.
      operationId: getUserHistory
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: История
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmploymentRecordDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/employees:
    get:
      tags: [Сотрудники и оргструктура]
      summary: Активные сотрудники
      description: Доступ — вошедшие. Для выбора соавторов.
      operationId: listEmployees
      responses:
        '200':
          description: Сотрудники
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonShort'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/departments:
    get:
      tags: [Сотрудники и оргструктура]
      summary: Подразделения
      description: Доступ — вошедшие.
      operationId: listDepartments
      responses:
        '200':
          description: Подразделения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Сотрудники и оргструктура]
      summary: Создание подразделения
      description: Доступ — админ.
      operationId: createDepartment
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Такое подразделение уже есть
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/departments/{id}:
    put:
      tags: [Сотрудники и оргструктура]
      summary: Изменение подразделения
      description: Доступ — админ.
      operationId: updateDepartment
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
      responses:
        '200':
          description: Изменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Такое подразделение уже есть
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/programs:
    get:
      tags: [Сотрудники и оргструктура]
      summary: Образовательные программы
      description: Доступ — вошедшие.
      operationId: listPrograms
      responses:
        '200':
          description: Программы
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Сотрудники и оргструктура]
      summary: Создание программы
      description: Доступ — админ.
      operationId: createProgram
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRequest'
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Код программы уже занят
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/programs/{id}:
    put:
      tags: [Сотрудники и оргструктура]
      summary: Изменение программы
      description: Доступ — админ.
      operationId: updateProgram
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRequest'
      responses:
        '200':
          description: Изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Код программы уже занят
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/indicators:
    get:
      tags: [Показатели]
      summary: Справочник показателей
      description: Доступ — вошедшие.
      operationId: listIndicators
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - name: evaluationType
          in: query
          schema:
            $ref: '#/components/schemas/EvaluationType'
        - name: archived
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Показатели
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndicatorDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Показатели]
      summary: Создание показателя
      description: Доступ — админ.
      operationId: createIndicator
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndicatorRequest'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Код показателя уже занят
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/indicators/{id}:
    get:
      tags: [Показатели]
      summary: Карточка показателя
      description: Доступ — вошедшие.
      operationId: getIndicator
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Показатель
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Показатели]
      summary: Новая редакция показателя
      description: Доступ — админ.
      operationId: updateIndicator
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndicatorRequest'
      responses:
        '200':
          description: Редакция создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Редакции пересекаются по датам
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/indicators/{id}/archive:
    post:
      tags: [Показатели]
      summary: Перенос в архив и возврат
      description: Доступ — админ.
      operationId: toggleIndicatorArchive
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/indicators/{id}/versions:
    get:
      tags: [Показатели]
      summary: Редакции показателя
      description: Доступ — вошедшие.
      operationId: listIndicatorVersions
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Редакции
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndicatorVersionDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/periods:
    get:
      tags: [Отчётные периоды]
      summary: Список периодов
      description: Доступ — вошедшие.
      operationId: listPeriods
      responses:
        '200':
          description: Периоды
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeriodDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Отчётные периоды]
      summary: Создание периода
      description: Доступ — админ.
      operationId: createPeriod
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodRequest'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Период этого типа пересекается с другим
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/periods/current:
    get:
