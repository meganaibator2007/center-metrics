# Подключается сам при docker compose up: порты базы и бэкенда для разработки, профиль dev.
# На стенде запуск без него: docker compose -f docker-compose.yml up -d --build
services:
  db:
    ports:
      - "${DB_PORT}:5432"

  backend:
    ports:
      - "${APP_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
