# nginx в контейнере frontend: раздаёт собранный клиент и пересылает API на бэкенд.
# Для браузера сайт и API на одном адресе, поэтому CORS не нужен, cookie сессии и CSRF работают как есть.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Файлы к записям до 10 МБ, как spring.servlet.multipart.max-file-size
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Имя backend ищется через DNS Docker при каждом запросе, а не один раз при старте:
    # после перезапуска бэкенда nginx найдёт его по новому адресу.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # Бэкенд стоит за прокси (server.forward-headers-strategy: framework)
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # API и Swagger отдаёт бэкенд
    location ~ ^/(api|swagger-ui|v3/api-docs)(/|$) {
        proxy_pass $backend;
    }
    location = /swagger-ui.html {
        proxy_pass $backend;
    }
    location = /openapi.yaml {
        proxy_pass $backend;
    }

    # Файлы сборки с хешем в имени не меняются: кэшируем надолго
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Файла с расширением нет (картинка, шрифт) — честный 404, а не index.html
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    # Любой другой адрес (/cabinet, /admin/users) — экран клиента, его выбирает React Router
    location / {
        try_files $uri /index.html;
    }

    # index.html не кэшируем, иначе после обновления браузер возьмёт старую сборку
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
