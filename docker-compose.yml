services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: center_metrics_frontend
    # Наружу открыт только фронт: браузер ходит на nginx, он пересылает /api на бэкенд
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: center_metrics_backend
    # Порт бэкенда наружу не открываем; для разработки он есть в docker-compose.override.yml
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_STORAGE_DIR: /app/storage
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # В eclipse-temurin:25-jre нет wget и curl, поэтому запрос к /api/health идёт средствами bash
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: postgres:16-alpine
    container_name: center_metrics_pg
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
    driver: local
  uploads:
    driver: local
